name: Deploy shortener

on:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC, so nothing long-lived is stored in the repo. The role is shared with the mail server's
# deploy and trusts this repository by name; it is managed out of band, not by either CDK app.
permissions:
  id-token: write
  contents: read

# One deploy at a time: two overlapping CloudFormation updates on the same stack fail the
# second, and a queued run would only deploy an older commit.
concurrency:
  group: deploy-shortener
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Runs before the deploy on purpose: the stack assertions catch a template that would
      # deploy but be wrong - a declared links table, or a create endpoint on the internet.
      - name: Test
        run: npm test

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::842390211626:role/github-actions-contrabass-deploy
          # us-east-1 is where the stack lives: an edge-optimised API domain needs its
          # certificate there, and the links table has been there since 2021.
          aws-region: us-east-1

      - name: Deploy
        run: npx cdk deploy ShorturlApexStack --require-approval never

      # A deploy that leaves the domain broken is a failed deploy even when CloudFormation is
      # happy, so the run only goes green once the live domain answers correctly.
      #
      # An unknown id is the whole check. Reaching our own 404 means DNS, the certificate, the
      # domain mapping, API Gateway, the Lambda and the DynamoDB read all worked and the link
      # simply was not there. A broken deploy fails differently and visibly: 403 when the path
      # is not mapped, 5xx when the Lambda cannot run, a TLS error when the certificate is
      # wrong. No credentials and no known-good id are needed, which is why this does not read
      # the table - the deploy role has no business holding read access to the links.
      - name: Check the live domain answers
        run: |
          set -euo pipefail
          body=$(curl -s --max-time 20 -w '\n%{http_code}' https://gben.me/zzznosuchlink)
          code=$(printf '%s' "$body" | tail -n1)
          echo "unknown link -> HTTP $code"
          printf '%s' "$body" | head -n1
          test "$code" = "404"
          printf '%s' "$body" | head -n1 | grep -q 'no such link'
